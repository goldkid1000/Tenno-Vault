<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Damage &amp; Status Bible — Tenno Vault</title>
<meta name="description" content="Every damage type and status proc, faction weaknesses, the Viral + Hunter Munitions meta, gating mechanics, crit tiers and more.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="images/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="images/apple-touch-icon-v2.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tenno Vault">
</head>
<body data-page="damage" data-crumb="Home,Damage Bible">
<div id="site-header"></div>
<div class="layout">
<aside id="sidebar"></aside>
<main id="main">
<div id="breadcrumbs"></div>
<h1>⚔️ Damage &amp; Status Bible</h1>
<div class="notice"><b>What is this?</b> Not all damage is equal. This guide shows what damage type to use against each enemy faction.</div>
<p class="muted small" id="d-count"></p>
<p class="muted">Every damage type, what its proc does, what each faction fears, and the meta formulas behind Steel Path (the hard-mode star chart) builds.</p>
<div class="field"><input id="d-q" type="search" placeholder="Filter damage types, factions…"></div>
<div id="d-detail"></div>
<div id="d-sections"></div>
<div id="related"></div>
</main>
</div>
<nav id="tabbar"></nav>
<footer id="site-footer"></footer>
<script src="js/app.js?v=20261009c"></script>
<script src="js/presence.js?v=20261009"></script>
<script src="js/ai.js?v=20261009"></script>
<script>
(function () {
  var esc = window.TV.esc;
  var SECTIONS = [
    { key: 'types', title: '🧪 Every damage type', sub: 'Proc, mechanics and what it is strong against' },
    { key: 'factions', title: '👹 Faction weakness chart', sub: 'What to bring against whom' },
    { key: 'meta', title: '📐 Meta formulas', sub: 'The math behind endgame builds' },
    { key: 'gating', title: '🛡️ Gating mechanics', sub: 'Shield gating, health gating, Overguard' },
    { key: 'combat', title: '🎯 Combat mechanics', sub: 'Falloff, multishot, crit tiers' }
  ];
  function card(e) {
    var title = esc(e.name || e.title);
    var badge = e.tag ? '<span class="badge">' + esc(e.tag) + '</span> ' : '';
    var sub = e.proc ? '<p class="muted">Proc: ' + esc(e.proc) + '</p>' :
      (e.weak ? '<p class="muted small">' + esc(e.weak) + '</p>' : '');
    var body = e.desc || e.detail || '';
    return '<div class="list-item" data-body="' +
      esc((title + ' ' + body + ' ' + (e.proc || '') + ' ' + (e.weak || '') + ' ' + (e.bonus || '')).toLowerCase()) + '">' +
      '<h3>' + badge + title + '</h3>' + sub +
      '<p class="muted small">' + esc(body.length > 140 ? body.slice(0, 140) + '…' : body) + '</p></div>';
  }
  function detail(e) {
    var rows = [];
    if (e.proc) rows.push('<div class="stat-row"><span class="muted">Status proc</span><b>' + esc(e.proc) + '</b></div>');
    if (e.tag) rows.push('<div class="stat-row"><span class="muted">Category</span><b>' + esc(e.tag) + '</b></div>');
    if (e.bonus) rows.push('<div class="stat-row"><span class="muted">Bonus vs</span><b>' + esc(e.bonus) + '</b></div>');
    if (e.weak) rows.push('<p><b>Weakness:</b> ' + esc(e.weak) + '</p>');
    if (e.detail) rows.push('<p>' + esc(e.detail) + '</p>');
    return '<div class="detail-box"><div class="detail-head"><h2>' +
      esc(e.name || e.title) + '</h2></div>' +
      (e.desc ? '<p>' + esc(e.desc) + '</p>' : '') + rows.join('') + '</div>';
  }
  var DATA = null;
  window.TV.getJSON('data/site/damage.json').then(function (d) {
    DATA = d;
    var total = SECTIONS.reduce(function (n, s) { return n + (d[s.key] || []).length; }, 0);
    document.getElementById('d-count').textContent = total + ' entries';
    document.getElementById('d-sections').innerHTML = SECTIONS.map(function (s, i) {
      var items = d[s.key] || [];
      return '<div class="d-sec" data-sec="' + i + '"><h2>' + s.title + '</h2>' +
        '<p class="muted small">' + s.sub + '</p><div class="item-list">' +
        items.map(function (e, j) {
          return card(e).replace('class="list-item"', 'class="list-item" data-sec="' + i + '" data-idx="' + j + '"');
        }).join('') + '</div></div>';
    }).join('');
    document.querySelectorAll('#d-sections .list-item').forEach(function (el) {
      el.addEventListener('click', function () {
        var e = DATA[SECTIONS[+el.dataset.sec].key][+el.dataset.idx];
        document.getElementById('d-detail').innerHTML = detail(e);
        document.getElementById('d-detail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });
    document.getElementById('related').innerHTML = window.TV.relatedLinks('Keep going', [
      { label: 'Mods database', sub: 'The 60/60s, Hunter Munitions and crit mods', url: 'mods.html' },
      { label: 'Weapons database', sub: 'Pick a weapon for your damage type', url: 'weapons.html' },
      { label: 'Helminth system', sub: 'Subsume the abilities that enable these combos', url: 'helminth.html' }
    ]);
  }).catch(function () {
    document.getElementById('d-sections').innerHTML = '<div class="notice">Could not load damage data.</div>';
  });
  document.getElementById('d-q').addEventListener('input', function (ev) {
    var q = ev.target.value.trim().toLowerCase();
    document.querySelectorAll('#d-sections .list-item').forEach(function (el) {
      el.style.display = (!q || el.dataset.body.indexOf(q) !== -1) ? '' : 'none';
    });
    document.querySelectorAll('#d-sections .d-sec').forEach(function (sec) {
      var any = Array.prototype.some.call(sec.querySelectorAll('.list-item'), function (el) {
        return el.style.display !== 'none';
      });
      sec.style.display = any ? '' : 'none';
    });
  });
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>
<script src="js/pwa-install.js"></script>
</body>
</html>
