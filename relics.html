<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relics — Tenno Vault</title>
<meta name="description" content="Every void relic: what's inside, and the best missions to farm each tier.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="images/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tenno Vault">
</head>
<body data-page="relics" data-crumb="Home,Relics">
<div id="site-header"></div>
<div class="layout">
<aside id="sidebar"></aside>
<main id="main">
<div id="breadcrumbs"></div>
<h1>Relics</h1>
<p class="muted small" id="r-count"></p>
<p class="muted">Crack relics in Void Fissure missions to get prime parts. <b>Lith</b> = easiest, <b>Axi</b> = hardest. Vault status rotates — check your in-game relic console for what's currently available.</p>
<div class="chip-row" id="r-tabs">
  <button class="chip active" data-t="all">All</button>
  <button class="chip" data-t="Lith">Lith</button>
  <button class="chip" data-t="Meso">Meso</button>
  <button class="chip" data-t="Neo">Neo</button>
  <button class="chip" data-t="Axi">Axi</button>
  <button class="chip" data-t="Requiem">Requiem</button>
</div>
<div class="field"><input id="r-q" type="search" placeholder="Search relics or the part inside…"></div>
<div id="r-detail"></div>
<div id="r-list" class="item-list"></div>
<div id="related"></div>
</main>
</div>
<nav id="tabbar"></nav>
<footer id="site-footer"></footer>
<script src="js/app.js?v=20261009c"></script>
<script src="js/presence.js?v=20261009"></script>
<script src="js/ai-fallback.js?v=20261010"></script>
<script src="js/ai.js?v=20261010"></script>
<script>
(function () {
  var esc = window.TV.esc, all = [], tier = 'all', ctl = null;
  function thumb(item, size) {
    if (!item.img) return '';
    return '<img src="' + item.img + '" alt="" loading="lazy" width="' + size + '" height="' + size + '"' +
      ' style="width:' + size + 'px;height:' + size + 'px;object-fit:contain;flex-shrink:0;border-radius:8px;background:rgba(255,255,255,0.04);"' +
      ' onerror="this.style.display=\'none\'">';
  }
  function card(r) {
    var a = document.createElement('a');
    a.className = 'list-item'; a.href = '#' + encodeURIComponent(r.name);
    var rare = r.rewards.filter(function (x) { return x.rarity === 'Rare'; })[0];
    a.innerHTML = '<div style="display:flex;gap:12px;align-items:center;">' + thumb(r, 64) +
      '<div><h3>' + esc(r.name) + ' <span class="badge type">' + esc(r.tier) + '</span></h3>' +
      '<p class="muted small">⭐ Rare: ' + esc(rare ? rare.name : '—') + '</p></div></div>';
    return a;
  }
  function filtered() {
    var q = document.getElementById('r-q').value.toLowerCase();
    return all.filter(function (r) {
      var okT = tier === 'all' || r.tier === tier;
      var okQ = !q || r.name.toLowerCase().indexOf(q) !== -1 ||
        r.rewards.some(function (x) { return (x.name || '').toLowerCase().indexOf(q) !== -1; });
      return okT && okQ;
    });
  }
  function showDetail(name) {
    var box = document.getElementById('r-detail');
    var r = all.find(function (x) { return x.name === name; });
    if (!r) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="detail-box"><div class="detail-head">' +
      (r.img ? '<img src="' + r.img + '" alt="' + esc(r.name) + '" loading="lazy" onerror="this.style.display=\'none\'">' : '') +
      '<div><h2>' + esc(r.name) + ' <span class="badge type">' + esc(r.tier) + ' relic</span></h2>' +
      '<p class="muted small">Refine at a fissure for better rare odds (25 → 50 → 75 → 100 void traces).</p></div></div>' +
      '<div class="farm-box"><h4>📍 Where to farm</h4><p>Crack in <b>Void Fissure</b> missions. ' +
      'Relics drop from endless missions (Survival/Defense/Excavation), Void captures, and open-world bounties.</p></div>' +
      '<h3>Possible rewards</h3>' +
      r.rewards.map(function (x) {
        var priceLink = x.urlName
          ? ' <a class="small" href="live.html#prices" data-part="' + esc(x.name) + '">check price 💎</a>' : '';
        return '<div class="mod-row"><div><b>' + esc(x.name || '?') + '</b></div>' +
          '<div><span class="badge ' + (x.rarity === 'Rare' ? 'oneshot' : 'type') + '">' + esc(x.rarity || '') + '</span>' + priceLink + '</div></div>';
      }).join('') + '</div>';
    box.scrollIntoView();
    document.getElementById('related').innerHTML = window.TV.relatedLinks('Keep going', [
      { label: 'Where to farm ' + r.tier + ' relics', sub: 'Best missions per tier', url: 'farming.html' },
      { label: 'How to sell prime parts', sub: 'Turn relics into platinum', url: 'trading.html' },
      { label: 'Live fissures', sub: 'Crack them right now', url: 'live.html' }
    ]);
  }
  window.TV.getJSONParts('data/site/relics', 6).then(function (d) {
    all = d;
    document.getElementById('r-count').textContent = d.length + ' Relics';
    var list = document.getElementById('r-list');
    ctl = window.TV.infiniteScroll(list, filtered(), card, 40);
    function refresh() { ctl.reset(filtered()); }
    document.getElementById('r-q').addEventListener('input', refresh);
    document.getElementById('r-tabs').addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      document.querySelectorAll('#r-tabs .chip').forEach(function (c) { c.classList.remove('active'); });
      b.classList.add('active'); tier = b.getAttribute('data-t');
      document.getElementById('r-detail').innerHTML = '';
      history.replaceState(null, '', ' ');
      refresh();
    });
    if (location.hash.length > 1) showDetail(decodeURIComponent(location.hash.slice(1)));
    window.addEventListener('hashchange', function () {
      showDetail(decodeURIComponent(location.hash.slice(1)));
    });
  }).catch(function () {
    document.getElementById('r-list').innerHTML = '<div class="notice">Couldn\'t load the data &mdash; this is usually a stale cache. <button class="btn small" onclick="window.TV.hardReload()">Tap to retry</button></div>';
  });
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>
<script src="js/pwa-install.js"></script>
</body>
</html>
