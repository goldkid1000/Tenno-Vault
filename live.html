<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live — Tenno Vault</title>
<meta name="description" content="Real-time Warframe info: day/night cycles, fissures, sorties, news, and live platinum prices.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="images/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tenno Vault">
</head>
<body data-page="live" data-crumb="Home,Live">
<div id="site-header"></div>
<div class="layout">
<aside id="sidebar"></aside>
<main id="main">
<div id="breadcrumbs"></div>
<h1>📡 Live</h1>
<p class="muted">Real game data, refreshed every minute. <span class="small">(Sources: warframestat.us, warframe.market)</span></p>

<div id="live-world"><div class="loading">Connecting to the Origin System…</div></div>

<h2 id="prices">💎 Platinum price checker</h2>
<p class="muted">Type a prime part or item name — see what in-game sellers are asking right now.</p>
<div class="field" style="display:flex;gap:8px;max-width:520px">
  <input id="plat-input" placeholder="e.g. Ash Prime Systems" list="plat-list">
  <datalist id="plat-list"></datalist>
  <button class="btn primary" id="plat-btn">Check</button>
</div>
<div id="plat-result"></div>

<div id="related"></div>
</main>
</div>
<nav id="tabbar"></nav>
<footer id="site-footer"></footer>
<script src="js/app.js?v=20261009c"></script>
<script src="js/presence.js?v=20261009"></script>
<script src="js/ai.js?v=20261009"></script>
<script src="js/live.js?v=20261009"></script>
<script>
(function () {
  // popular parts for autocomplete
  var POP = ['Ash Prime Systems', 'Rhino Prime Chassis', 'Volt Prime Neuroptics',
    'Saryn Prime Systems', 'Nova Prime Chassis', 'Frost Prime Neuroptics',
    'Ember Prime Blueprint', 'Loki Prime Systems', 'Mag Prime Chassis', 'Trinity Prime Systems'];
  document.getElementById('plat-list').innerHTML =
    POP.map(function (p) { return '<option value="' + p + '">'; }).join('');
  document.getElementById('related').innerHTML = window.TV.relatedLinks('Keep going', [
    { label: 'How to sell prime parts', sub: 'Turn prices into profit', url: 'trading.html' },
    { label: 'Relic farms', sub: 'Farm the parts yourself', url: 'farming.html' },
    { label: 'Player market board', sub: 'Listings from other Tenno', url: 'marketplace.html' }
  ]);
  if (location.hash === '#prices') {
    setTimeout(function () {
      document.getElementById('prices').scrollIntoView();
      document.getElementById('plat-input').focus();
    }, 400);
  }
})();
</script>
</body>
</html>
