<h1>🔄 Mod Swaps</h1>
<div class="notice"><b>Don't have the best mod?</b> Here's what to use instead. Each card shows the best-in-slot mod and ranked alternatives with how effective they are — for damage, one-shots, and Steel Path.</div>

<div id="swap-cats" style="margin:1em 0;display:flex;gap:8px;flex-wrap:wrap"></div>

</main>
</div>
<div id="tabbar"></div>

<script src="data/site/mod-swaps.js?v=20261012"></script>
<script>
(function () {
  var cats = document.getElementById('swap-cats');
  var list = document.getElementById('swap-list');
  var active = 'all';

  function effBadge(eff) {
    if (eff >= 130) return '<span class="pill" style="background:#1a4d2e;color:#7CFC00">⬆ ' + eff + '% — better</span>';
    if (eff >= 90) return '<span class="pill" style="background:#1a3a4d;color:#7ec8ff">~' + eff + '% — close</span>';
    if (eff >= 50) return '<span class="pill" style="background:#4d3a1a;color:#ffcc7e">~' + eff + '% — weaker</span>';
    if (eff > 0) return '<span class="pill" style="background:#4d1a1a;color:#ff7e7e">~' + eff + '% — much weaker</span>';
    return '<span class="pill" style="background:#333;color:#aaa">no substitute</span>';
  }

  function render() {
    var html = '';
    MOD_SWAPS.forEach(function (cat) {
      if (active !== 'all' && cat.category !== active) return;
      html += '<h2>' + cat.icon + ' ' + cat.category + '</h2>';
      html += '<p class="muted">' + cat.desc + '</p>';
      html += '<div class="card-grid">';
      cat.swaps.forEach(function (s) {
        html += '<div class="card"><h3>⭐ ' + s.best + '</h3>';
        html += '<p class="muted small">' + s.bestNote + '</p>';
        html += '<h4 style="margin:.8em 0 .4em">Instead, use:</h4>';
        s.alternatives.forEach(function (a) {
          html += '<div style="margin:.5em 0;padding:.6em;background:#0f1526;border-radius:8px">';
          html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">';
          html += '<b>' + a.mod + '</b>' + effBadge(a.effectiveness);
          html += '</div><p class="muted small" style="margin:.3em 0 0">' + a.note + '</p></div>';
        });
        html += '</div>';
      });
      html += '</div>';
    });
    list.innerHTML = html || '<p class="muted">Nothing here.</p>';
  }

  function renderCats() {
    var html = '<button class="btn small' + (active === 'all' ? ' primary' : '') + '" data-cat="all">All</button>';
    MOD_SWAPS.forEach(function (c) {
      html += '<button class="btn small' + (active === c.category ? ' primary' : '') + '" data-cat="' + c.category + '">' + c.icon + ' ' + c.category + '</button>';
    });
    cats.innerHTML = html;
    cats.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        active = b.getAttribute('data-cat');
        renderCats(); render();
      });
    });
  }

  renderCats(); render();
})();
</script>
