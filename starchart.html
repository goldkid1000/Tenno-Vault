<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Chart — Tenno Vault</title>
<meta name="description" content="Interactive Warframe star chart — tap any planet or zone to see what drops there, or fly to where your item farms.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="images/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="images/apple-touch-icon-v2.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tenno Vault">
<style>
/* ---- Star Chart page styles ---- */
.sc-wrap { position: relative; }
.sc-map { width: 100%; height: auto; max-height: 70vh; background: #04060d; border-radius: 12px; border: 1px solid rgba(0,229,255,.15); touch-action: pan-x pan-y; }
.sc-orbit { fill: none; stroke: rgba(0,229,255,.07); stroke-width: 1; }
.sc-star { fill: #fff; opacity: .5; }
.sc-sun { filter: drop-shadow(0 0 24px rgba(255,180,80,.9)); }
.sc-body { cursor: pointer; }
.sc-body circle.core { transition: filter .25s ease; }
.sc-body:hover circle.core, .sc-body:focus circle.core { filter: drop-shadow(0 0 10px currentColor); }
.sc-label { fill: #b0c4de; font-size: 13px; text-anchor: middle; pointer-events: none; font-family: inherit; }
.sc-body:hover .sc-label { fill: #fff; }
.sc-halo { fill: none; stroke: currentColor; stroke-width: 2; opacity: 0; pointer-events: none;
  transform-box: fill-box; transform-origin: center; }
.sc-body.target .sc-halo { opacity: .9; animation: sc-pulse 2s ease-in-out infinite; }
@keyframes sc-pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.35); opacity: .3; } }
.sc-drift { animation: sc-drift 14s ease-in-out infinite alternate; }
@keyframes sc-drift { from { transform: translate(0,0); } to { transform: translate(0,-7px); } }
.sc-zone-label { fill: #8a9bb5; font-size: 11px; text-anchor: middle; pointer-events: none; }
.sc-tip { position: absolute; pointer-events: none; background: rgba(10,18,32,.95); border: 1px solid rgba(0,229,255,.4);
  border-radius: 8px; padding: 6px 10px; font-size: 13px; color: #fff; z-index: 5; display: none; white-space: nowrap; }
.sc-panel { margin-top: 12px; }
.sc-legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.sc-legend .badge { cursor: pointer; }
#sc-camera { transition: transform 1.1s cubic-bezier(.22,.8,.3,1); transform-origin: 0 0; }
.sc-controls { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) {
  .sc-drift, .sc-body.target .sc-halo { animation: none; }
  #sc-camera { transition: none; }
}
</style>
</head>
<body data-page="starchart" data-crumb="Home,Star Chart">
<div id="site-header"></div>
<div class="layout">
<aside id="sidebar"></aside>
<main id="main">
<div id="breadcrumbs"></div>
<h1>Star Chart</h1>
<div class="notice"><b>What is this?</b> The Warframe solar system. Tap any planet or zone to see what drops there. Opened from an item? The map flies straight to where it farms.</div>
<div class="sc-controls">
  <button class="btn small" id="sc-reset">⟲ Reset view</button>
  <span class="muted small" id="sc-hint">Tap a planet or zone for details</span>
</div>
<div class="sc-wrap">
  <svg class="sc-map" id="sc-svg" viewBox="0 0 1200 800" role="img" aria-label="Interactive Warframe star chart">
    <defs>
      <radialGradient id="sc-sun-g" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff3d0"/><stop offset="55%" stop-color="#ffbe5a"/><stop offset="100%" stop-color="#ff8a3a" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g id="sc-camera">
      <g id="sc-stars"></g>
      <g id="sc-orbits"></g>
      <g id="sc-sun-layer"></g>
      <g id="sc-bodies"></g>
      <text x="600" y="600" class="sc-zone-label" id="sc-special-label" style="font-size:14px;letter-spacing:3px;fill:#5a6b85">— SPECIAL ZONES —</text>
    </g>
  </svg>
  <div class="sc-tip" id="sc-tip"></div>
</div>
<div class="sc-panel" id="sc-panel"><p class="muted">Select a planet or zone to see what farms there.</p></div>
<div id="related"></div>
</main>
</div>
<script src="js/app.js"></script>
<script src="js/update-notify.js"></script>
<script>
(function () {
  'use strict';
  var esc = window.TV.esc;
  var svg = document.getElementById('sc-svg');
  var camera = document.getElementById('sc-camera');
  var bodiesG = document.getElementById('sc-bodies');
  var tip = document.getElementById('sc-tip');
  var panel = document.getElementById('sc-panel');
  var chart = null, itemPlanets = null, zoneItems = {};
  var NS = 'http://www.w3.org/2000/svg';
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  /* stars */
  (function stars() {
    var g = document.getElementById('sc-stars'), seed = 42;
    function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    for (var i = 0; i < 160; i++) {
      var c = el('circle', { cx: (rnd() * 1200).toFixed(0), cy: (rnd() * 800).toFixed(0),
        r: (rnd() * 1.4 + 0.3).toFixed(1), 'class': 'sc-star' }, g);
      c.style.opacity = (rnd() * 0.5 + 0.15).toFixed(2);
    }
  })();

  function params() {
    var m = {};
    location.search.slice(1).split('&').forEach(function (p) {
      var kv = p.split('=');
      if (kv[0]) m[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
    });
    return m;
  }

  function buildChart() {
    var bodies = chart.planets.concat(chart.zones);
    /* orbits for planets */
    var og = document.getElementById('sc-orbits');
    chart.planets.forEach(function (p, i) {
      var rx = Math.abs(p.x - 120) + 30, ry = 120 + (i % 3) * 22;
      el('ellipse', { cx: 120, cy: 400, rx: rx, ry: Math.min(ry, 330), 'class': 'sc-orbit' }, og);
    });
    /* sun */
    var sg = document.getElementById('sc-sun-layer');
    el('circle', { cx: 120, cy: 400, r: 52, fill: 'url(#sc-sun-g)', 'class': 'sc-sun' }, sg);
    el('circle', { cx: 120, cy: 400, r: 30, fill: '#ffbe5a' }, sg);
    var sl = el('text', { x: 120, y: 470, 'class': 'sc-label' }, sg);
    sl.textContent = 'Sun';

    bodies.forEach(function (b, i) {
      var g = el('g', { 'class': 'sc-body' + (b.type === 'zone' ? ' sc-zone' : ''), tabindex: 0,
        role: 'button', 'aria-label': b.name, 'data-id': b.id }, bodiesG);
      g.style.color = b.color;
      var drift = el('g', { 'class': reduced ? '' : 'sc-drift' }, g);
      drift.style.animationDuration = (11 + (i % 7) * 2.5) + 's';
      drift.style.animationDelay = (-(i * 1.3) % 10) + 's';
      if (b.ring) {
        el('ellipse', { cx: b.x, cy: b.y, rx: b.r * 1.7, ry: b.r * 0.55, fill: 'none',
          stroke: b.color, 'stroke-width': 2.5, opacity: .5, transform: 'rotate(-18 ' + b.x + ' ' + b.y + ')' }, drift);
      }
      el('circle', { cx: b.x, cy: b.y, r: b.r + 7, 'class': 'sc-halo' }, drift);
      el('circle', { cx: b.x, cy: b.y, r: b.r, fill: b.color, 'class': 'core', opacity: .92 }, drift);
      el('circle', { cx: b.x - b.r * .3, cy: b.y - b.r * .3, r: b.r * .45, fill: '#ffffff', opacity: .14 }, drift);
      var lbl = el('text', { x: b.x, y: b.y + b.r + 16, 'class': b.type === 'zone' ? 'sc-zone-label' : 'sc-label' }, drift);
      lbl.textContent = b.name;
      g.addEventListener('mouseenter', function (ev) { showTip(b, ev); });
      g.addEventListener('mousemove', moveTip);
      g.addEventListener('mouseleave', hideTip);
      g.addEventListener('click', function () { selectBody(b.id, true); });
      g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectBody(b.id, true); } });
    });
  }

  function showTip(b, ev) {
    tip.textContent = b.name;
    tip.style.display = 'block';
    moveTip(ev);
  }
  function moveTip(ev) {
    if (!ev || ev.clientX === undefined) return;
    var r = svg.getBoundingClientRect();
    tip.style.left = Math.min(ev.clientX - r.left + 12, r.width - 140) + 'px';
    tip.style.top = (ev.clientY - r.top - 34) + 'px';
  }
  function hideTip() { tip.style.display = 'none'; }

  function allBodies() { return chart.planets.concat(chart.zones); }
  function bodyById(id) { return allBodies().filter(function (b) { return b.id === id; })[0]; }

  function selectBody(id, fly) {
    var b = bodyById(id);
    if (!b) return;
    hideTip();
    var items = zoneItems[id] || [];
    var html = '<div class="detail-box"><div class="detail-head"><div>' +
      '<h2 style="color:' + esc(b.color) + '">' + esc(b.name) + '</h2>' +
      '<p>' + esc(b.description) + '</p></div></div>';
    if (items.length) {
      html += '<h3>Farms here (' + items.length + ')</h3><div class="item-list">' +
        items.slice(0, 24).map(function (it) {
          return '<div class="mod-row"><div><b>' + esc(it.name) + '</b>' +
            (it.note ? '<div class="muted small">' + esc(it.note) + '</div>' : '') + '</div></div>';
        }).join('') + '</div>' +
        (items.length > 24 ? '<p class="muted small">+' + (items.length - 24) + ' more — search them by name in the Vault.</p>' : '');
    } else {
      html += '<p class="muted">No mapped farm data for this location yet.</p>';
    }
    html += '</div>';
    panel.innerHTML = html;
    panel.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' });
    document.querySelectorAll('.sc-body').forEach(function (g) { g.classList.remove('active'); });
    var g = bodiesG.querySelector('[data-id="' + id + '"]');
    if (g) g.classList.add('active');
    if (fly) flyTo([id], false);
  }

  /* fly-to: pan + zoom the camera to frame the given zone ids */
  function flyTo(ids, isItem) {
    var pts = ids.map(bodyById).filter(Boolean);
    if (!pts.length) return;
    var xs = pts.map(function (p) { return p.x; }), ys = pts.map(function (p) { return p.y; });
    var minX = Math.min.apply(null, xs) - 90, maxX = Math.max.apply(null, xs) + 90;
    var minY = Math.min.apply(null, ys) - 90, maxY = Math.max.apply(null, ys) + 90;
    var vw = 1200, vh = 800;
    var scale = Math.min(vw / (maxX - minX), vh / (maxY - minY), 2.6);
    scale = Math.max(scale, 1);
    var cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    var tx = vw / 2 - cx * scale, ty = vh / 2 - cy * scale;
    camera.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + scale.toFixed(3) + ')';
    document.getElementById('sc-hint').textContent = isItem
      ? 'Showing farm locations — tap a pulsing planet for details'
      : 'Tap a planet or zone for details';
  }

  function resetView() {
    camera.style.transform = '';
    document.querySelectorAll('.sc-body').forEach(function (g) { g.classList.remove('target', 'active'); });
    document.getElementById('sc-hint').textContent = 'Tap a planet or zone for details';
    panel.innerHTML = '<p class="muted">Select a planet or zone to see what farms there.</p>';
  }
  document.getElementById('sc-reset').addEventListener('click', resetView);

  /* load data */
  Promise.all([
    window.TV.getJSON('data/site/starchart.json'),
    window.TV.getJSON('data/site/item-planets-0.json'),
    window.TV.getJSON('data/site/item-planets-1.json'),
    window.TV.getJSON('data/site/item-planets-2.json')
  ]).then(function (res) {
    chart = res[0];
    itemPlanets = Object.assign({}, res[1], res[2], res[3]);
    /* reverse index: zone -> items */
    Object.keys(itemPlanets).forEach(function (name) {
      var e = itemPlanets[name];
      e.zones.forEach(function (z) {
        (zoneItems[z] = zoneItems[z] || []).push({ name: name, note: e.note });
      });
    });
    buildChart();
    /* item deep-link: ?item=Ash+Prime */
    var q = params();
    if (q.item && itemPlanets[q.item]) {
      var entry = itemPlanets[q.item];
      entry.zones.forEach(function (z) {
        var g = bodiesG.querySelector('[data-id="' + z + '"]');
        if (g) g.classList.add('target');
      });
      document.title = q.item + ' — Star Chart — Tenno Vault';
      /* let the map render, then fly */
      setTimeout(function () { flyTo(entry.zones, true); }, reduced ? 0 : 350);
      /* auto-open the first zone's panel */
      setTimeout(function () { selectBody(entry.zones[0], false); }, reduced ? 60 : 1500);
    }
  }).catch(function () {
    panel.innerHTML = '<div class="notice">Couldn\'t load the star chart data — this is usually a stale cache. <button class="btn small" onclick="window.TV.hardReload()">Tap to retry</button></div>';
  });

  document.getElementById('related').innerHTML = window.TV.relatedLinks('Keep going', [
    { label: 'Resource Finder', sub: 'Every material and where it drops', url: 'resources.html' },
    { label: 'Farming', sub: 'Where to farm anything', url: 'farming.html' },
    { label: 'Relics', sub: 'Prime parts from the Void', url: 'relics.html' }
  ]);
})();
</script>
</body>
</html>
