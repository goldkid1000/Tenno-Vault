<div id="site-header"></div>
<div class="layout">
<aside id="sidebar"></aside>
<main id="main">
<div id="breadcrumbs"></div>
<h1>Builds</h1>
<div class="notice"><b>What is this?</b> Ready-made mod setups for Warframes and weapons. <b>One-shot</b> builds kill Steel Path (hard mode) enemies in one hit. Click any build to see every mod and where to farm it.</div>
<p class="muted small" id="b-count"></p>
<div id="b-filters">
  <div class="filter-group">
    <span class="filter-label">By difficulty</span>
    <div class="chip-row">
      <button class="chip" data-f="beginner">🌱 Beginner</button>
      <button class="chip" data-f="one-shot">💥 One-shot Steel Path</button>
      <button class="chip" data-f="steel-path">🛡 Steel Path</button>
      <button class="chip" data-f="strong">💪 Strong</button>
    </div>
  </div>
  <div class="filter-group">
    <span class="filter-label">By purpose</span>
    <div class="chip-row">
      <button class="chip" data-f="boss">🎯 Boss Hunting</button>
      <button class="chip" data-f="farm">📦 Farming</button>
      <button class="chip" data-f="leveling">📈 Leveling</button>
      <button class="chip active" data-f="all">All</button>
    </div>
  </div>
</div>
<div class="field"><input id="b-q" type="search" placeholder="Search builds by frame or weapon name…"></div>
<div id="b-detail"></div>

<script>document.addEventListener("DOMContentLoaded",function(){var l=document.getElementById("b-list");if(l&&window.TV&&window.TV.skeletonCards)window.TV.showLoader(l);});</script>
<div id="b-list" class="card-grid"></div>
<div id="related"></div>
</main>
</div>
<nav id="tabbar"></nav>
<footer id="site-footer"></footer>
<script src="js/app.js?v=20261012"></script>
<script src="js/presence.js?v=20261012"></script>
<script src="js/ai-fallback.js?v=20261012"></script>
<script src="js/ai.js?v=20261012"></script>
<script>
(function () {
  var esc = window.TV.esc, builds = [], modDrops = {}, filter = 'all', query = '';
  function filtered() {
    return builds.filter(function (b) {
      var okFilter = true;
      if (filter === 'one-shot') okFilter = b.tags.indexOf('one-shot') !== -1 || b.recommendedOneShot;
      else if (filter !== 'all') okFilter = b.tags.indexOf(filter) !== -1;
      if (!okFilter) return false;
      if (query) {
        var q = query.toLowerCase();
        return (b.name + ' ' + b.item + ' ' + (b.category || '')).toLowerCase().indexOf(q) !== -1;
      }
      return true;
    });
  }
  function card(b, idx) {
    var a = document.createElement('a');
    a.className = 'card'; a.href = '#build-' + b.id;
    a.style.animationDelay = Math.min((idx || 0) * 25, 300) + 'ms';
    a.innerHTML = (b.recommendedOneShot ? '<span class="badge recommended">Recommended one-shot</span>' : '') +
      window.TV.badge(b.tags) +
      '<h3>' + esc(b.name) + '</h3>' +
      '<p class="card-item">' + esc(b.item) + '</p>' +
      '<p>' + esc(b.description.slice(0, 100)) + '…</p>' +
      '<span class="view-hint">👁 View build</span>';
    return a;
  }
  function farmFor(modName) {
    var d = modDrops[modName];
    if (d && d.length) return esc(d[0].location) + (d[0].chance ? ' (' + d[0].chance + '%)' : '');
    return 'See mod page';
  }
  function showDetail(id) {
    var box = document.getElementById('b-detail');
    var b = null;
    for (var i = 0; i < builds.length; i++) if (builds[i].id === id) b = builds[i];
    if (!b) { box.innerHTML = ''; return; }
    /* Vaulty's hot take on this item */
    var takeHTML = '';
    try {
      if (window.TV && window.TV.mentor && typeof window.TV.mentor.take === 'function') {
        var take = window.TV.mentor.take(b.item || b.name);
        if (take) takeHTML = '<div class="vaulty-take"><b>🗨️ Vaulty says:</b> ' + esc(take) + '</div>';
      }
    } catch (e) {}
    box.innerHTML = '<div class="detail-box">' +
      (b.recommendedOneShot ? '<span class="badge recommended">⭐ Recommended one-shot</span>' : '') +
      window.TV.badge(b.tags) +
      '<h2>' + esc(b.name) + '</h2>' + takeHTML + '<p>' + esc(b.description) + '</p>' +
      (b.progenitor ? '<p><b>Progenitor:</b> ' + esc(b.progenitor) + '</p>' : '') +
      (b.weaponNote ? '<p class="muted">' + esc(b.weaponNote) + '</p>' : '') +
      '<h3 class="mods-head">Mods <button type="button" class="btn small ghost" id="b-copymods">📋 Copy mod list</button></h3>' + b.mods.map(function (m) {
        return '<div class="mod-row"><div><b><a href="mods.html#' + encodeURIComponent(m.name) + '">' + esc(m.name) + '</a></b>' +
          ' <a class="btn small ghost" href="starchart.html?item=' + encodeURIComponent(m.name) + '" title="See where to farm this mod">🗺️</a>' +
          (m.note ? ' <span class="muted small">— ' + esc(m.note) + '</span>' : '') +
          '<div class="farm">📍 ' + farmFor(m.name) + '</div></div></div>';
      }).join('') +
      (b.arcane ? '<h3>Arcane</h3><p><a href="arcanes.html#' + encodeURIComponent(b.arcane) + '">' + esc(b.arcane) + '</a></p>' : '') +
      '<h3>How to play it</h3><p>' + esc(b.playstyle) + '</p>' +
      '<div id="b-video"></div></div>';
    var copyBtn = document.getElementById('b-copymods');
    if (copyBtn) copyBtn.addEventListener('click', function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      var text = b.mods.map(function (m) { return m.name; }).join('\n');
      var ok = function () {
        copyBtn.textContent = '✅ Copied';
        setTimeout(function () { copyBtn.textContent = '📋 Copy mod list'; }, 1800);
      };
      var fallback = function () {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta); ok();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
      else fallback();
    });
    /* best video guide for this build's item */
    (function () {
      var vbox = document.getElementById('b-video');
      if (!vbox) return;
      var itemName = (b.item || b.name || '').toLowerCase();
      window.TV.getJSON('data/site/videos.json').then(function (vs) {
        var match = null;
        for (var i = 0; i < vs.length; i++) {
          var vn = (vs[i].item || '').toLowerCase();
          if (vn && itemName.indexOf(vn) !== -1) { match = vs[i]; break; }
        }
        if (match) {
          vbox.innerHTML = '<h3>📺 Best video guide</h3>' +
            '<a class="card video-link" href="https://www.youtube.com/watch?v=' + esc(match.id) + '" target="_blank" rel="noopener">' +
            '<b>' + esc(match.title) + '</b><p class="muted small">' + esc(match.channel) + ' — ' + esc(match.description).slice(0, 100) + '…</p>' +
            '<span class="btn small">▶ Watch on YouTube</span></a>';
        }
      }).catch(function () {});
    })();
    box.scrollIntoView();
    var rel = [];
    (b.related || []).forEach(function (rid) {
      for (var j = 0; j < builds.length; j++) {
        if (builds[j].id === rid) rel.push({ label: builds[j].name, sub: builds[j].description.slice(0, 80) + '…', url: '#build-' + builds[j].id });
      }
    });
    rel.push({ label: 'All builds', sub: 'Back to the list', url: 'builds.html' });
    rel.push({ label: '⛏️ Resource Finder', sub: 'Where to farm crafting materials', url: 'resources.html' });
    document.getElementById('related').innerHTML = window.TV.relatedLinks('If you liked this build…', rel);
  }
  var PAGE_SIZE = 48;
  var shown = PAGE_SIZE;
  function drawList() {
    var list = document.getElementById('b-list');
    list.innerHTML = '';
    var items = filtered();
    var visible = items.slice(0, shown);
    visible.forEach(function (b, i) { list.appendChild(card(b, i)); });
    /* load more button */
    var more = document.getElementById('b-more');
    if (more) more.remove();
    if (items.length > shown) {
      var btn = document.createElement('button');
      btn.id = 'b-more'; btn.className = 'btn primary';
      btn.style.cssText = 'display:block;margin:18px auto;';
      btn.textContent = 'Show more (' + (items.length - shown) + ' remaining)';
      btn.addEventListener('click', function () { shown += PAGE_SIZE; drawList(); });
      list.parentNode.appendChild(btn);
    }
    if (!items.length) list.innerHTML = '<div class="notice">No builds in this category yet.</div>';
    document.getElementById('b-count').textContent = items.length + ' of ' + builds.length + ' Builds';
  }
  function resetShown() { shown = PAGE_SIZE; }
  function setFilter(f) {
    filter = f;
    var chips = document.querySelectorAll('#b-filters .chip');    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('active', chips[i].getAttribute('data-f') === f);
    }
    document.getElementById('b-detail').innerHTML = '';
    history.replaceState(null, '', ' ');
    resetShown();
    drawList();
  }
  /* v2.12.43: progressive load — render builds as soon as their parts
     arrive (with a progress count), then load mods in the background.
     Mods are only needed for farm locations inside a build's detail view,
     so the list no longer waits on all 20 files before showing anything. */
  function loadPartsProgress(base, count, onProgress) {
    var out = new Array(count), done = 0;
    var jobs = [];
    for (var i = 0; i < count; i++) {
      (function (idx) {
        jobs.push(window.TV.getJSON(base + '-' + idx + '.json').then(function (part) {
          out[idx] = part;
          done++;
          if (onProgress) onProgress(done, count);
          return part;
        }));
      })(i);
    }
    return Promise.all(jobs).then(function () { return [].concat.apply([], out); });
  }
  function setLoadText(t) {
    var p = document.querySelector('#b-list .tv-loader p');
    if (p) p.textContent = t;
  }
  loadPartsProgress('data/site/builds', 11, function (d, t) {
    setLoadText('Loading builds… ' + d + '/' + t);
  }).then(function (allBuilds) {
    builds = allBuilds;
    document.getElementById('b-count').textContent = builds.length + ' Builds';
    document.getElementById('b-filters').addEventListener('click', function (e) {
      var c = e.target.closest ? e.target.closest('.chip') : null;
      if (!c) return;
      setFilter(c.getAttribute('data-f'));
    });
    document.getElementById('b-q').addEventListener('input', function (e) {
      query = e.target.value.trim();
      document.getElementById('b-detail').innerHTML = '';
      history.replaceState(null, '', ' ');
      resetShown();
      drawList();
    });
    var h = location.hash;
    if (h.indexOf('#build-') === 0) showDetail(h.slice(7));
    else if (h === '#one-shot') setFilter('one-shot');
    drawList();
    window.addEventListener('hashchange', function () {
      var hh = location.hash;
      if (hh.indexOf('#build-') === 0) showDetail(hh.slice(7));
      else if (hh === '#one-shot') setFilter('one-shot');
      else document.getElementById('b-detail').innerHTML = '';
    });
    /* mods in the background — refresh an open detail once they land */
    loadPartsProgress('data/site/mods', 9, null).then(function (mods) {
      mods.forEach(function (m) { modDrops[m.name] = m.drops; });
      var hh = location.hash;
      if (hh.indexOf('#build-') === 0) showDetail(hh.slice(7));
    }).catch(function () { /* farm locations fall back to "See mod page" */ });
  }).catch(function () {
    document.getElementById('b-list').innerHTML = '<div class="notice">Couldn\'t load the data &mdash; this is usually a stale cache. <button class="btn small" onclick="window.TV.hardReload()">Tap to retry</button></div>';
  });
})();
</script>
