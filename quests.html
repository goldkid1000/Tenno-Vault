<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest Guide — Tenno Vault</title>
<meta name="description" content="Every Warframe story quest in release order: prerequisites, key rewards, story significance, and solo vs squad notes.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="images/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tenno Vault">
</head>
<body data-page="quests" data-crumb="Home,Quest Guide">
<div id="site-header"></div>
<div class="layout">
<aside id="sidebar"></aside>
<main id="main">
<div id="breadcrumbs"></div>
<h1>🗺️ Story Quest Guide</h1>
<p class="muted small" id="q-count"></p>
<p class="muted">Every story quest in release order. Most quests force solo play; squad notes are included where it matters. Tap any quest for prerequisites, rewards, and what it unlocks.</p>
<div class="field"><input id="q-q" type="search" placeholder="Filter…"></div>
<div id="q-detail"></div>
<div id="q-list" class="item-list"></div>
<div id="related"></div>
</main>
</div>
<nav id="tabbar"></nav>
<footer id="site-footer"></footer>
<script src="js/app.js?v=20261009c"></script>
<script src="js/presence.js?v=20261009"></script>
<script src="js/ai.js?v=20261009"></script>
<script>
(function () {
  var esc = window.TV.esc, all = [], ctl = null;
  function card(x) {
    var d = document.createElement('a');
    d.className = 'list-item'; d.href = '#' + encodeURIComponent(x.name);
    d.innerHTML = '<div><h3>' + esc(x.order) + '. ' + esc(x.name) +
      ' <span class="badge type">' + esc(x.arc) + '</span></h3>' +
      '<p class="muted small">Unlocks: ' + esc((x.rewards || '').slice(0, 110)) + '</p></div>';
    return d;
  }
  function showDetail(name) {
    var box = document.getElementById('q-detail');
    var x = all.find(function (y) { return y.name === name; });
    if (!x) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="detail-box"><h2>' + esc(x.order) + '. ' + esc(x.name) + '</h2>' +
      '<div style="margin-bottom:10px"><span class="badge type">' + esc(x.arc) + '</span></div>' +
      '<div class="stat-row"><span class="stat">Prerequisite: <b>' + esc(x.prereq) + '</b></span></div>' +
      '<div class="farm-box"><h4>🎁 Key rewards &amp; unlocks</h4><p>' + esc(x.rewards) + '</p></div>' +
      '<p><b>Story significance:</b><br>' + esc(x.story) + '</p>' +
      '<p class="muted small"><b>Notes:</b> ' + esc(x.tips) + '</p></div>';
    box.scrollIntoView();
  }
  function filtered() {
    var q = document.getElementById('q-q').value.toLowerCase();
    if (!q) return all;
    return all.filter(function (x) {
      return (x.name + ' ' + x.arc + ' ' + x.rewards + ' ' + x.prereq).toLowerCase().indexOf(q) !== -1;
    });
  }
  window.TV.getJSON('data/site/quests.json').then(function (d) {
    all = d.slice().sort(function (a, b) { return a.order - b.order; });
    document.getElementById('q-count').textContent = all.length + ' story quests, in release order';
    var list = document.getElementById('q-list');
    ctl = window.TV.infiniteScroll(list, filtered(), card, 40);
    document.getElementById('q-q').addEventListener('input', function () { ctl.reset(filtered()); });
    document.getElementById('related').innerHTML = window.TV.relatedLinks('Keep going', [
      { label: 'Liches & Sisters', sub: 'Unlocked after The War Within', url: 'liches.html' },
      { label: 'New player guide', sub: 'Start strong', url: 'index.html#beginner-guide' },
      { label: 'Ask the Vault AI', sub: 'Stuck on a quest?', url: 'index.html' }
    ]);
    if (location.hash.length > 1) showDetail(decodeURIComponent(location.hash.slice(1)));
    window.addEventListener('hashchange', function () {
      showDetail(decodeURIComponent(location.hash.slice(1)));
    });
  }).catch(function () {
    document.getElementById('q-list').innerHTML = '<div class="notice">Couldn\'t load the data &mdash; this is usually a stale cache. <button class="btn small" onclick="window.TV.hardReload()">Tap to retry</button></div>';
  });
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>
<script src="js/pwa-install.js"></script>
</body>
</html>
