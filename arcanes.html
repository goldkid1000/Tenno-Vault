<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcanes — Tenno Vault</title>
<meta name="description" content="Every arcane: what it does, max rank effect, and where to farm it.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="images/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tenno Vault">
</head>
<body data-page="arcanes" data-crumb="Home,Arcanes">
<div id="site-header"></div>
<div class="layout">
<aside id="sidebar"></aside>
<main id="main">
<div id="breadcrumbs"></div>
<h1>Arcanes</h1>
<p class="muted small" id="a-count"></p>
<p class="muted">Bonus powers you slot onto Warframes, weapons and Operators. Max them to rank 5 by combining duplicates.</p>
<div class="field"><input id="a-q" type="search" placeholder="Filter arcanes…"></div>
<div id="a-detail"></div>
<div id="a-list" class="item-list"></div>
<div id="related"></div>
</main>
</div>
<nav id="tabbar"></nav>
<footer id="site-footer"></footer>
<script src="js/app.js?v=20261009c"></script>
<script src="js/presence.js?v=20261009"></script>
<script src="js/ai.js?v=20261009"></script>
<script>
(function () {
  var esc = window.TV.esc, all = [], ctl = null;
  function thumb(item, size) {
    if (!item.img) return '';
    return '<img src="' + item.img + '" alt="" loading="lazy" width="' + size + '" height="' + size + '"' +
      ' style="width:' + size + 'px;height:' + size + 'px;object-fit:contain;flex-shrink:0;border-radius:8px;background:rgba(255,255,255,0.04);"' +
      ' onerror="this.style.display=\'none\'">';
  }
  function card(a) {
    var d = document.createElement('a');
    d.className = 'list-item'; d.href = '#' + encodeURIComponent(a.name);
    d.innerHTML = '<div style="display:flex;gap:12px;align-items:center;">' + thumb(a, 64) +
      '<div><h3>' + esc(a.name) +
      (a.type ? ' <span class="badge type">' + esc(a.type) + '</span>' : '') + '</h3>' +
      '<p class="muted small">' + esc((a.effect || '').slice(0, 130)) + '</p></div></div>';
    return d;
  }
  function showDetail(name) {
    var box = document.getElementById('a-detail');
    var a = all.find(function (x) { return x.name === name; });
    if (!a) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="detail-box"><div class="detail-head">' +
      (a.img ? '<img src="' + a.img + '" alt="' + esc(a.name) + '" loading="lazy" onerror="this.style.display=\'none\'">' : '') +
      '<div><h2>' + esc(a.name) + '</h2>' +
      (a.type ? '<span class="badge type">' + esc(a.type) + '</span> ' : '') +
      (a.rarity ? '<span class="badge type">' + esc(a.rarity) + '</span>' : '') + '</div></div>' +
      '<p><b>Max rank effect:</b><br>' + esc(a.effect || 'No description available.') + '</p>' +
      '<div class="farm-box"><h4>📍 Where to farm</h4><p>' + ((a.drops && a.drops.length)
        ? a.drops.map(function (d) { return esc(d.location) + (d.chance ? ' <span class="muted">(' + d.chance + '%)</span>' : ''); }).join('<br>')
        : 'Check the in-game Codex for the latest source.') + '</p></div></div>';
    box.scrollIntoView();
    document.getElementById('related').innerHTML = window.TV.relatedLinks('Keep going', [
      { label: 'Builds using arcanes', sub: 'Steel Path & one-shot setups', url: 'builds.html' },
      { label: 'Farming hub', sub: 'Arcane farms', url: 'farming.html' }
    ]);
  }
  window.TV.getJSON('data/site/arcanes.json').then(function (d) {
    all = d;
    document.getElementById('a-count').textContent = d.length + ' Arcanes';
    var list = document.getElementById('a-list');
    ctl = window.TV.infiniteScroll(list, all, card, 40);
    document.getElementById('a-q').addEventListener('input', function (e) {
      var q = e.target.value.toLowerCase();
      ctl.reset(all.filter(function (a) { return a.name.toLowerCase().indexOf(q) !== -1; }));
    });
    if (location.hash.length > 1) showDetail(decodeURIComponent(location.hash.slice(1)));
    window.addEventListener('hashchange', function () {
      showDetail(decodeURIComponent(location.hash.slice(1)));
    });
  }).catch(function () {
    document.getElementById('a-list').innerHTML = '<div class="notice">Couldn\'t load the data &mdash; this is usually a stale cache. <button class="btn small" onclick="window.TV.hardReload()">Tap to retry</button></div>';
  });
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>
<script src="js/pwa-install.js"></script>
</body>
</html>
