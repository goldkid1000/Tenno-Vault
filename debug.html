<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Debug</title></head>
<body>
<h1>Fetch Debug</h1>
<div id="out"><p>Running tests…</p></div>
<script src="js/app.js?v=20261009b"></script>
<script>
(function () {
  var out = document.getElementById('out');
  function log(msg) { out.innerHTML += '<p>' + msg + '</p>'; }
  function step(name, fn) {
    try {
      var r = fn();
      if (r && r.then) {
        return r.then(function (v) { log(name + ': OK'); return v; },
                      function (e) { log(name + ': REJECTED: ' + (e && e.message || e)); throw e; });
      }
      log(name + ': OK');
      return r;
    } catch (e) {
      log(name + ': THREW: ' + e.message + ' | stack: ' + (e.stack || '').split('\n').slice(0,3).join(' / '));
      throw e;
    }
  }
  log('typeof window.TV.getJSONParts: ' + typeof window.TV.getJSONParts);
  var all = [];
  step('getJSONParts warframes', function () {
    return window.TV.getJSONParts('data/site/warframes', 2);
  }).then(function (d) {
    all = d;
    log('items loaded: ' + d.length);
    step('getElementById wf-list', function () {
      var el = document.createElement('div'); el.id = 'wf-list-test';
      document.body.appendChild(el); return el;
    });
    return null;
  }).then(function () {
    var list = document.createElement('div');
    var esc = window.TV.esc;
    function card(w) {
      var a = document.createElement('a');
      a.href = '#' + encodeURIComponent(w.name);
      a.innerHTML = '<h3>' + esc(w.name) + '</h3>';
      return a;
    }
    step('infiniteScroll init', function () {
      return window.TV.infiniteScroll(list, all, card, 30);
    });
    step('rendered children', function () {
      log('list children: ' + list.children.length);
      return true;
    });
  }).catch(function (e) {
    log('CHAIN FAILED: ' + (e && e.message || e));
  });
})();
</script>
</body></html>
