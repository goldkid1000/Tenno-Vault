<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Debug</title></head>
<body>
<h1>Fetch Debug</h1>
<div id="out"><p>Running tests…</p></div>
<script>
(function () {
  var out = document.getElementById('out');
  function log(msg) { out.innerHTML += '<p>' + msg + '</p>'; }
  log('User agent: ' + navigator.userAgent);
  log('URL: ' + location.href);
  log('typeof fetch: ' + typeof fetch);
  log('typeof Promise: ' + typeof Promise);
  // Test 1: basic fetch of chunk 0
  fetch('data/site/warframes-0.json', { cache: 'no-store' }).then(function (r) {
    log('Test 1 fetch: ok=' + r.ok + ' status=' + r.status + ' type=' + r.type);
    return r.text();
  }).then(function (t) {
    log('Test 1 text length: ' + t.length);
    var d = JSON.parse(t);
    log('Test 1 parsed: ' + d.length + ' items, first=' + d[0].name);
  }).catch(function (e) {
    log('Test 1 FAILED: ' + e.name + ': ' + e.message);
  });
  // Test 2: check window.TV
  setTimeout(function () {
    log('typeof window.TV: ' + typeof window.TV);
  }, 500);
})();
</script>
<script src="js/app.js?v=20261009b"></script>
</body></html>
