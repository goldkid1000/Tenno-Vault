<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helminth — Tenno Vault</title>
<meta name="description" content="The complete Helminth guide: how to unlock it, subsuming, secretions, the subsumable ability tier list, Bile costs and Invigorations.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="images/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="images/apple-touch-icon-v2.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tenno Vault">
</head>
<body data-page="helminth" data-crumb="Home,Helminth">
<div id="site-header"></div>
<div class="layout">
<aside id="sidebar"></aside>
<main id="main">
<div id="breadcrumbs"></div>
<h1>🧬 Helminth System</h1>
<div class="notice"><b>What is this?</b> The Helminth lets you swap one ability from any Warframe onto another. Here's every swappable ability, ranked.</div>
<p class="muted small" id="h-count"></p>
<p class="muted">Steal one ability from any Warframe and put it on another. Unlock the system, feed the mouth, and pick your subsume from the tier list.</p>
<div class="field"><input id="h-q" type="search" placeholder="Filter abilities, secretions…"></div>
<div id="h-detail"></div>
<div id="h-sections"></div>
<div id="related"></div>
</main>
</div>
<nav id="tabbar"></nav>
<footer id="site-footer"></footer>
<script src="js/app.js?v=20261009c"></script>
<script src="js/presence.js?v=20261009"></script>
<script src="js/ai.js?v=20261009"></script>
<script>
(function () {
  var esc = window.TV.esc;
  var SECTIONS = [
    { key: 'unlock', title: '🔓 How to unlock', sub: 'Deimos → Entrati Rank 3 → Son' },
    { key: 'subsume', title: '🪑 How subsuming works', sub: 'Feed a frame, wait 24h, keep the ability forever' },
    { key: 'secretions', title: '🍽️ Secretions & feeding', sub: 'What to feed the mouth and where to farm it' },
    { key: 'tierlist', title: '🏆 Subsumable ability tier list', sub: 'What each frame grants and where to put it' },
    { key: 'innate', title: '✨ Helminth innate abilities', sub: 'Unlocked by Metamorphosis rank, usable on any frame' },
    { key: 'bile', title: '🟢 Bile costs', sub: 'The rarest secretion — plan around it' },
    { key: 'invigoration', title: '💪 Invigorations', sub: 'Weekly buffs for 3 random frames' }
  ];
  function card(e) {
    var title = esc(e.name || e.ability || e.title);
    var badge = e.tier ? '<span class="badge">' + esc(e.tier) + '-tier</span> ' :
      (e.tag ? '<span class="badge">' + esc(e.tag) + '</span> ' : '');
    var sub = e.frame ? '<p class="muted">From ' + esc(e.frame) + '</p>' :
      (e.farm ? '<p class="muted">🌾 ' + esc(e.farm.split('.')[0]) + '</p>' : '');
    var body = e.desc || e.detail || '';
    return '<div class="list-item" data-title="' + title.replace(/"/g, '') + '" data-body="' +
      esc((body + ' ' + (e.why || '') + ' ' + (e.bestOn || '') + ' ' + (e.note || '')).toLowerCase()) + '">' +
      '<h3>' + badge + title + '</h3>' + sub +
      '<p class="muted small">' + esc(body.length > 140 ? body.slice(0, 140) + '…' : body) + '</p></div>';
  }
  function detail(e) {
    var rows = [];
    if (e.frame) rows.push('<div class="stat-row"><span class="muted">From</span><b>' + esc(e.frame) + '</b></div>');
    if (e.tier) rows.push('<div class="stat-row"><span class="muted">Tier</span><b>' + esc(e.tier) + '</b></div>');
    if (e.tag) rows.push('<div class="stat-row"><span class="muted">Type</span><b>' + esc(e.tag) + '</b></div>');
    if (e.proc) rows.push('<div class="stat-row"><span class="muted">Proc</span><b>' + esc(e.proc) + '</b></div>');
    if (e.why) rows.push('<p><b>Why:</b> ' + esc(e.why) + '</p>');
    if (e.bestOn) rows.push('<p><b>Best on:</b> ' + esc(e.bestOn) + '</p>');
    if (e.farm) rows.push('<p><b>🌾 Farm:</b> ' + esc(e.farm) + '</p>');
    if (e.note) rows.push('<p class="muted small">' + esc(e.note) + '</p>');
    if (e.detail) rows.push('<p>' + esc(e.detail) + '</p>');
    return '<div class="detail-box"><div class="detail-head"><h2>' +
      esc(e.name || e.ability || e.title) + '</h2></div>' +
      (e.desc ? '<p>' + esc(e.desc) + '</p>' : '') + rows.join('') + '</div>';
  }
  var DATA = null;
  window.TV.getJSON('data/site/helminth.json').then(function (d) {
    DATA = d;
    var total = SECTIONS.reduce(function (n, s) { return n + (d[s.key] || []).length; }, 0);
    document.getElementById('h-count').textContent = total + ' entries';
    document.getElementById('h-sections').innerHTML = SECTIONS.map(function (s, i) {
      var items = d[s.key] || [];
      return '<div class="h-sec" data-sec="' + i + '"><h2>' + s.title + '</h2>' +
        '<p class="muted small">' + s.sub + '</p><div class="item-list">' +
        items.map(function (e, j) {
          return card(e).replace('class="list-item"', 'class="list-item" data-sec="' + i + '" data-idx="' + j + '"');
        }).join('') + '</div></div>';
    }).join('');
    document.querySelectorAll('#h-sections .list-item').forEach(function (el) {
      el.addEventListener('click', function () {
        var e = DATA[SECTIONS[+el.dataset.sec].key][+el.dataset.idx];
        document.getElementById('h-detail').innerHTML = detail(e);
        document.getElementById('h-detail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });
    document.getElementById('related').innerHTML = window.TV.relatedLinks('Keep going', [
      { label: 'Warframes database', sub: 'Every frame and its abilities', url: 'warframes.html' },
      { label: 'Farming Hub', sub: 'Where to farm secretion resources', url: 'farming.html' },
      { label: 'Damage Bible', sub: 'What your new ability should enable', url: 'damage.html' }
    ]);
  }).catch(function () {
    document.getElementById('h-sections').innerHTML = '<div class="notice">Could not load Helminth data.</div>';
  });
  document.getElementById('h-q').addEventListener('input', function (ev) {
    var q = ev.target.value.trim().toLowerCase();
    document.querySelectorAll('#h-sections .list-item').forEach(function (el) {
      el.style.display = (!q || el.dataset.body.indexOf(q) !== -1) ? '' : 'none';
    });
    document.querySelectorAll('#h-sections .h-sec').forEach(function (sec) {
      var any = Array.prototype.some.call(sec.querySelectorAll('.list-item'), function (el) {
        return el.style.display !== 'none';
      });
      sec.style.display = any ? '' : 'none';
    });
  });
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>
<script src="js/pwa-install.js"></script>
</body>
</html>
