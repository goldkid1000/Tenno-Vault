<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videos — Tenno Vault</title>
<meta name="description" content="Curated Warframe video guides: builds, farms, and platinum — watch without leaving.">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="videos" data-crumb="Home,Videos">
<div id="site-header"></div>
<div class="layout">
<aside id="sidebar"></aside>
<main id="main">
<div id="breadcrumbs"></div>
<h1>🎬 Videos</h1>
<p class="muted">Stuck? Watch a guide right here — no need to leave the Vault.</p>
<div class="chip-row" id="v-filters">
  <button class="chip active" data-f="all">All</button>
  <button class="chip" data-f="Builds">Builds</button>
  <button class="chip" data-f="Trading">Trading</button>
</div>
<div id="v-list" class="video-grid"></div>
<div id="related"></div>
</main>
</div>
<nav id="tabbar"></nav>
<footer id="site-footer"></footer>
<script src="js/app.js?v=20261009"></script>
<script src="js/ai.js?v=20261009"></script>
<script>
(function () {
  var esc = window.TV.esc, all = [], filter = 'all';
  function draw() {
    var list = document.getElementById('v-list');
    list.innerHTML = all.filter(function (v) {
      return filter === 'all' || v.category === filter;
    }).map(function (v) {
      return '<div class="video-card">' +
        '<iframe src="https://www.youtube-nocookie.com/embed/' + esc(v.id) + '" ' +
        'title="' + esc(v.title) + '" loading="lazy" ' +
        'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" ' +
        'allowfullscreen></iframe>' +
        '<div class="vbody"><span class="badge type">' + esc(v.category) + '</span>' +
        '<h3>' + esc(v.title) + '</h3><p class="muted small">' + esc(v.description) + '</p></div></div>';
    }).join('');
  }
  window.TV.getJSON('data/site/videos.json').then(function (d) {
    all = d; draw();
    document.getElementById('v-filters').addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      document.querySelectorAll('#v-filters .chip').forEach(function (c) { c.classList.remove('active'); });
      b.classList.add('active'); filter = b.getAttribute('data-f'); draw();
    });
    document.getElementById('related').innerHTML = window.TV.relatedLinks('Keep going', [
      { label: 'Builds', sub: 'Written guides with mod lists', url: 'builds.html' },
      { label: 'Trading guide', sub: 'Sell for platinum', url: 'trading.html' }
    ]);
  }).catch(function () {
    document.getElementById('v-list').innerHTML = '<div class="notice">Could not load videos.</div>';
  });
})();
</script>
</body>
</html>
